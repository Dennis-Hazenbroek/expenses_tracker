<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget Tracker</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17231f;
      background: #f4f7f5;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 12% 0%, #e0f0e7 0, transparent 38rem),
        #f4f7f5;
    }

    button, input, select { font: inherit; }
    .shell { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: 46px 0 64px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 38px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 750; letter-spacing: -0.02em; }
    .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 12px; color: white; background: #1d7658; font-size: 20px; }
    .export-link { color: #28694f; font-size: 14px; font-weight: 650; text-decoration: none; }
    .export-link:hover { text-decoration: underline; }
    .intro { margin-bottom: 26px; }
    .eyebrow { margin: 0 0 8px; color: #56806c; font-size: 12px; font-weight: 750; letter-spacing: 0.13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 42px); letter-spacing: -0.045em; line-height: 1.1; }
    .subtitle { margin: 10px 0 0; color: #728078; font-size: 15px; }

    .summary { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 14px; margin-bottom: 22px; }
    .card, .panel { border: 1px solid #e3ebe6; border-radius: 18px; background: rgba(255,255,255,0.92); box-shadow: 0 8px 26px rgba(32, 63, 47, 0.045); }
    .card { min-height: 132px; padding: 22px 24px; }
    .card.balance { color: white; border-color: #1d7658; background: linear-gradient(145deg, #258564, #17694e); }
    .card-label { margin: 0 0 14px; color: #77877e; font-size: 13px; font-weight: 650; }
    .balance .card-label { color: #d3eee1; }
    .card-value { margin: 0; font-size: clamp(25px, 4vw, 34px); font-weight: 750; letter-spacing: -0.045em; }
    .income-value { color: #23845f; }
    .expense-value { color: #c15f4d; }

    .content { display: grid; grid-template-columns: 0.85fr 1.5fr; gap: 18px; align-items: start; }
    .panel { padding: 24px; }
    .panel-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 22px; }
    h2 { margin: 0; font-size: 18px; letter-spacing: -0.025em; }
    .field { display: grid; gap: 8px; margin-bottom: 16px; }
    label { color: #56665d; font-size: 13px; font-weight: 650; }
    input, select {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid #dce5df;
      border-radius: 10px;
      outline: none;
      color: #17231f;
      background: white;
    }
    input:focus, select:focus { border-color: #2b8a65; box-shadow: 0 0 0 3px rgba(43, 138, 101, 0.12); }
    .submit-button { width: 100%; min-height: 46px; margin-top: 5px; border: 0; border-radius: 10px; color: white; background: #1d7658; font-weight: 700; cursor: pointer; transition: background 120ms ease, transform 120ms ease; }
    .submit-button:hover { background: #165f46; }
    .submit-button:active { transform: translateY(1px); }
    .submit-button:disabled { opacity: 0.65; cursor: wait; }
    .status { min-height: 20px; margin: 12px 0 0; color: #687970; font-size: 13px; }
    .status.error { color: #b64739; }

    .transaction-list { display: grid; }
    .transaction { display: grid; grid-template-columns: 42px 1fr auto; align-items: center; gap: 13px; padding: 14px 0; border-top: 1px solid #edf1ee; }
    .transaction-icon { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 12px; background: #edf5f0; color: #27805e; font-size: 18px; font-weight: 700; }
    .transaction-icon.expense { color: #bc614f; background: #fbefec; }
    .transaction-title { overflow: hidden; color: #24342b; font-size: 14px; font-weight: 680; text-overflow: ellipsis; white-space: nowrap; }
    .transaction-meta { margin-top: 5px; color: #87948c; font-size: 12px; }
    .transaction-amount { white-space: nowrap; font-size: 14px; font-weight: 720; }
    .transaction-amount.income { color: #23845f; }
    .transaction-amount.expense { color: #bd614f; }
    .empty-state { padding: 34px 12px; border-top: 1px solid #edf1ee; color: #7d8b82; font-size: 14px; text-align: center; }

    @media (max-width: 720px) {
      .shell { width: min(100% - 28px, 560px); padding-top: 28px; }
      .topbar { margin-bottom: 30px; }
      .summary { grid-template-columns: 1fr 1fr; }
      .card.balance { grid-column: 1 / -1; }
      .content { grid-template-columns: 1fr; }
      .panel { padding: 20px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">£</span> Budget Tracker</div>
      <a class="export-link" href="/api/export.csv">Download CSV</a>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Your finances at a glance</p>
      <h1 id="page-title">Overview</h1>
      <p class="subtitle">Keep track of what comes in and what goes out.</p>
    </section>

    <section class="summary" aria-label="Account summary">
      <article class="card balance">
        <p class="card-label">Current balance</p>
        <p class="card-value" id="balance" aria-live="polite">—</p>
      </article>
      <article class="card">
        <p class="card-label">Total income</p>
        <p class="card-value income-value" id="income">—</p>
      </article>
      <article class="card">
        <p class="card-label">Total expenses</p>
        <p class="card-value expense-value" id="expenses">—</p>
      </article>
    </section>

    <section class="content">
      <form class="panel" id="transaction-form">
        <div class="panel-heading"><h2>Add transaction</h2></div>
        <div class="field">
          <label for="type">Transaction type</label>
          <select id="type" name="type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <div class="field">
          <label for="title">Description</label>
          <input id="title" name="title" type="text" maxlength="120" placeholder="e.g. Groceries" required>
        </div>
        <div class="field">
          <label for="amount">Amount</label>
          <input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required>
        </div>
        <div class="field">
          <label for="category">Category</label>
          <input id="category" name="category" type="text" maxlength="80" placeholder="e.g. Food" required>
        </div>
        <div class="field">
          <label for="date">Date</label>
          <input id="date" name="date" type="date" required>
        </div>
        <button class="submit-button" id="submit-button" type="submit">Add transaction</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>

      <section class="panel" aria-labelledby="transactions-heading">
        <div class="panel-heading">
          <h2 id="transactions-heading">Recent transactions</h2>
        </div>
        <div class="transaction-list" id="transaction-list" aria-live="polite">
          <div class="empty-state">Loading transactions…</div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const form = document.querySelector("#transaction-form");
    const statusMessage = document.querySelector("#status");
    const submitButton = document.querySelector("#submit-button");
    const dateInput = document.querySelector("#date");

    function localToday() {
      const today = new Date();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");
      return `${today.getFullYear()}-${month}-${day}`;
    }

    function money(value) {
      return new Intl.NumberFormat("en-GB", {
        style: "currency",
        currency: "GBP"
      }).format(Number(value));
    }

    function renderTransactions(items) {
      const list = document.querySelector("#transaction-list");
      list.replaceChildren();

      if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No transactions yet. Add one to get started.";
        list.append(empty);
        return;
      }

      for (const item of items) {
        const row = document.createElement("article");
        row.className = "transaction";

        const icon = document.createElement("span");
        icon.className = `transaction-icon ${item.type}`;
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = item.type === "income" ? "+" : "−";

        const details = document.createElement("div");
        const title = document.createElement("div");
        title.className = "transaction-title";
        title.textContent = item.title;
        const meta = document.createElement("div");
        meta.className = "transaction-meta";
        meta.textContent = `${item.category} · ${item.date}`;
        details.append(title, meta);

        const amount = document.createElement("div");
        amount.className = `transaction-amount ${item.type}`;
        amount.textContent = `${item.type === "income" ? "+" : "−"}${money(item.amount)}`;

        row.append(icon, details, amount);
        list.append(row);
      }
    }

    function renderDashboard(data) {
      document.querySelector("#balance").textContent = money(data.balance);
      document.querySelector("#income").textContent = money(data.income);
      document.querySelector("#expenses").textContent = money(data.expenses);
      renderTransactions(data.transactions);
    }

    async function loadDashboard() {
      const response = await fetch("/api/transactions");
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || "Could not load transactions.");
      }
      renderDashboard(data);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusMessage.className = "status";
      statusMessage.textContent = "";
      submitButton.disabled = true;

      const payload = Object.fromEntries(new FormData(form));
      try {
        const response = await fetch("/api/transactions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Could not save this transaction.");
        }

        renderDashboard(data);
        form.reset();
        dateInput.value = localToday();
        statusMessage.textContent = "Transaction added and balance updated.";
      } catch (error) {
        statusMessage.classList.add("error");
        statusMessage.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });

    dateInput.value = localToday();
    loadDashboard().catch((error) => {
      statusMessage.classList.add("error");
      statusMessage.textContent = error.message;
      document.querySelector("#transaction-list").textContent =
        "Could not load transactions. Please refresh the page.";
    });
  </script>
</body>
</html>
